services:
  backend:
    build: ./backend
    container_name: craas-backend
    environment:
      # 大模型
      - LLM_MODE=${LLM_MODE:-auto}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # 对接真实环境（不填则走 mock）
      - COMPUTE_DRIVER=${COMPUTE_DRIVER:-mock}
      - OS_AUTH_URL=${OS_AUTH_URL:-}
      - OS_USERNAME=${OS_USERNAME:-}
      - OS_PASSWORD=${OS_PASSWORD:-}
      - OS_PROJECT_NAME=${OS_PROJECT_NAME:-admin}
      - OS_USER_DOMAIN=${OS_USER_DOMAIN:-Default}
      - OS_PROJECT_DOMAIN=${OS_PROJECT_DOMAIN:-Default}
      - OS_REGION=${OS_REGION:-RegionOne}
      - OS_NETWORK_ID=${OS_NETWORK_ID:-}
      - OS_IMAGE_MAP=${OS_IMAGE_MAP:-{}}
      - COMPUTE_TIMEOUT=${COMPUTE_TIMEOUT:-900}
      - METRICS_DRIVER=${METRICS_DRIVER:-mock}
      - PROM_URL=${PROM_URL:-http://127.0.0.1:9090}
      - PROM_NIC=${PROM_NIC:-eth0}
      - PROM_NIC_BPS=${PROM_NIC_BPS:-1000000000}
      - RESOURCE_DRIVER=${RESOURCE_DRIVER:-mock}
      - CMDB_URL=${CMDB_URL:-}
      - CMDB_TOKEN=${CMDB_TOKEN:-}
      - RESOURCE_SYNC_INTERVAL=${RESOURCE_SYNC_INTERVAL:-0}
      - ALERT_DRIVER=${ALERT_DRIVER:-mock}
      - ALERT_URL=${ALERT_URL:-http://127.0.0.1:9093}
    volumes:
      - craas-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: craas-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  craas-data:
